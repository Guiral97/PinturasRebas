<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta del catálogo</title>
<link rel="icon" href="favicon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<style>
  :root {
    color-scheme: light dark;   /* barras de desplazamiento y controles según el tema */
    --fondo: #E3E4E1; --panel: #F6F6F3; --tinta: #1A2127; --suave: #5B646B;
    --linea: #C6CAC8; --acento: #0E5266; --acento-tinta: #FFFFFF; --alerta: #A1281F; --radio: 6px;
    font-family: "Barlow", system-ui, sans-serif; color: var(--tinta); background: var(--fondo);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #171C20; --panel: #20272D; --tinta: #E8EBEB; --suave: #9AA3A9;
      --linea: #343E46; --acento: #5AAEC4; --acento-tinta: #0B2530; --alerta: #E57B72;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-size: 16px; line-height: 1.45; background: var(--fondo); }
  [hidden] { display: none !important; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
  input, select { font: inherit; color: var(--tinta); background: var(--panel); border: 1px solid var(--linea); border-radius: var(--radio); padding: .5rem .65rem; width: 100%; min-height: 2.75rem; }
  label { font-weight: 600; }
  .campo { display: grid; gap: .3rem; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 2.75rem;
    border: 1px solid var(--linea); background: var(--panel); color: var(--tinta); padding: .45rem .9rem;
    border-radius: 8px; white-space: nowrap; text-decoration: none; font-weight: 600;
  }
  .btn-primario { background: var(--acento); color: var(--acento-tinta); border-color: var(--acento); font-weight: 700; }
  .btn-primario:disabled { opacity: .45; cursor: not-allowed; }
  h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 700; margin: 0; font-size: 2.1rem; line-height: 1.1; }

  .barra { display: flex; align-items: center; gap: 1rem; padding: .7rem 1.25rem; background: var(--panel); border-bottom: 1px solid var(--linea); }
  .marca { display: flex; align-items: center; gap: .55rem; color: inherit; text-decoration: none; min-width: 0; }
  .tienda { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 1.45rem; }
  .logo { height: 3.3rem; width: auto; display: block; flex: none; margin: -.45rem 0; }

  main { max-width: 75rem; margin: 0 auto; padding: 1.25rem; display: grid; gap: 1.25rem; }
  .controles { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: .75rem; align-items: end; padding: 1rem; background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; }
  .ayuda { color: var(--suave); margin: 0; }
  .ayuda a { color: var(--acento); font-weight: 600; }
  .error { color: var(--alerta); font-weight: 600; margin: 0; }
  .vista { overflow-x: auto; padding-bottom: .5rem; }

  /* ===== Lo que se imprime: medidas reales (96 px = 1 pulgada; la tarjeta mide 340 × 189 px = 9 × 5 cm)
     y colores fijos, como el papel ===== */
  .hoja { width: 21.59cm; min-height: 27.94cm; padding: 1.47cm 1.79cm; margin: 0 auto; background: #fff; color: #111; box-shadow: 0 1px 4px rgba(0, 0, 0, .2); }
  .hoja.sin-margen { padding: 0; }
  .hoja svg.qr { display: block; width: 100%; height: 100%; }
  .hoja .titulo, .hoja .l-nombre, .hoja .l-sub, .hoja .ceja { font-family: "Bebas Neue", "Barlow Condensed", sans-serif; font-weight: 400; }
  /* La foto del logo trae fondo negro alrededor: se recorta a la pistola */
  .hoja .pistola { flex: none; overflow: hidden; }
  .hoja .pistola img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 48%; }

  .tarjetas { display: grid; grid-template-columns: repeat(2, 9cm); grid-auto-rows: 5cm; justify-content: center; }
  .tarjeta { position: relative; overflow: hidden; outline: .2mm dashed #B5B9B7; outline-offset: -.1mm; }   /* línea de corte */
  .tarjeta.negra { background: #000; color: #fff; }

  /* Frente */
  .frente { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 16px 20px; }
  .frente .pistola { width: 72px; height: 132px; }
  .lockup { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .frente .l-nombre { font-size: 34px; line-height: .95; letter-spacing: .01em; white-space: nowrap; }
  .frente .l-linea { height: 1.5px; background: #fff; }
  .frente .l-sub { font-size: 16px; line-height: 1; letter-spacing: .06em; white-space: nowrap; }

  /* Reversos */
  .reverso { display: grid; grid-template-columns: minmax(0, 1fr) 118px; gap: 14px; align-items: center; padding: 16px 16px 16px 20px; }
  .reverso .texto { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .reverso .ceja-fila { display: flex; align-items: center; gap: 6px; }
  .reverso .ceja { font-size: 13px; letter-spacing: .12em; line-height: 1; }
  .reverso .titulo { font-size: 34px; line-height: .9; letter-spacing: .005em; text-wrap: balance; overflow-wrap: anywhere; }
  .reverso .mensaje { font-size: 12px; line-height: 1.25; }
  .reverso .datos { font-size: 11px; line-height: 1.25; font-weight: 500; }
  .reverso .qr-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .reverso .qr-caja { width: 118px; height: 118px; }

  .claro .raya { width: 18px; height: 3px; background: #0E5266; }
  .claro .ceja { color: #0E5266; }
  .claro .mensaje { color: #333; }
  .claro .datos, .claro .pie-qr { color: #5B646B; }
  .claro .pie-qr { font-family: "Bebas Neue", sans-serif; font-size: 12px; letter-spacing: .1em; line-height: 1; }

  .oscuro { grid-template-columns: minmax(0, 1fr) 126px; }
  .oscuro .pistola { width: 24px; height: 44px; }
  .oscuro .ceja { font-size: 14px; letter-spacing: .1em; }
  .oscuro .ceja-fila { gap: 8px; }
  .oscuro .raya { width: 40px; height: 1.5px; background: #fff; }
  .oscuro .mensaje, .oscuro .datos { color: #D9DCDB; }
  .oscuro .qr-caja { width: 126px; height: 126px; padding: 4px; background: #fff; border-radius: 6px; }

  /* Aviso de mostrador: hoja carta completa */
  .aviso { width: 816px; height: 1056px; display: flex; flex-direction: column; background: #fff; color: #111; }
  .aviso .banda { height: 312px; flex: none; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; gap: 36px; padding: 40px 72px; }
  .aviso .pistola { width: 128px; height: 232px; }
  .aviso .lockup { gap: 14px; }
  .aviso .l-nombre { font-size: 76px; line-height: .92; letter-spacing: .01em; white-space: nowrap; }
  .aviso .l-linea { height: 3px; background: #fff; }
  .aviso .l-sub { font-size: 34px; line-height: 1; letter-spacing: .06em; white-space: nowrap; }
  .aviso .cuerpo { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 40px 72px 48px; text-align: center; }
  .aviso .ceja-fila { display: flex; align-items: center; gap: 12px; }
  .aviso .raya { width: 40px; height: 4px; background: #0E5266; }
  .aviso .ceja { font-size: 26px; letter-spacing: .14em; line-height: 1; color: #0E5266; }
  .aviso .titulo { font-size: 92px; line-height: .9; letter-spacing: .005em; text-wrap: balance; }
  .aviso .qr-caja { width: 310px; height: 310px; padding: 12px; border: 3px solid #111; border-radius: 12px; }
  .aviso .mensaje { font-size: 26px; line-height: 1.3; font-weight: 500; max-width: 600px; }
  .aviso .datos { font-size: 17px; line-height: 1.3; color: #5B646B; overflow-wrap: anywhere; }

  @page { size: letter; margin: 0; }
  @media print {
    body { background: #fff; }
    .barra, .controles, .ayuda, h1 { display: none !important; }
    main { padding: 0; display: block; max-width: none; }
    .vista { overflow: visible; padding: 0; }
    .hoja { box-shadow: none; margin: 0; height: 27.9cm; min-height: 0; overflow: hidden; }   /* una sola hoja, sin página en blanco al final */
    .hoja * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }   /* que salgan los fondos negros */
  }

  @media (max-width: 700px) {
    .barra { padding: .6rem 1rem; }
    .tienda { font-size: 1.25rem; }
    .logo { height: 2.9rem; margin: -.3rem 0; }
    main { padding: 1rem; }
    h1 { font-size: 1.8rem; }
    .controles { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>

<header class="barra">
  <a class="marca" href="inventario.html" aria-label="Ir a inventario"><img class="logo" src="logo.svg" alt="" width="24" height="40"><span class="tienda" id="nombreTienda">Pinturas</span></a>
</header>

<main>
  <h1>Tarjeta del catálogo</h1>
  <p class="ayuda">Invitación con código QR al <a href="catalogo.html" target="_blank" rel="noopener">catálogo público</a>, en hoja carta. Las tarjetas salen 10 por hoja para recortar por la línea punteada. Para tarjetas de dos caras, imprime una hoja de frentes y, en el respaldo de esa misma hoja, una de reversos.</p>

  <div class="controles">
    <div class="campo"><label for="formato">Qué imprimir</label>
      <select id="formato">
        <option value="frente">Tarjetas · frente</option>
        <option value="claro">Tarjetas · reverso claro</option>
        <option value="oscuro">Tarjetas · reverso oscuro</option>
        <option value="aviso">Aviso para el mostrador</option>
      </select>
    </div>
    <div class="campo" data-texto><label for="titulo">Título</label><input id="titulo" value="Mira nuestro catálogo" maxlength="32"></div>
    <div class="campo" data-texto><label for="mensaje">Mensaje</label><input id="mensaje" value="Escanea el código con la cámara de tu celular." maxlength="70"></div>
    <button type="button" class="btn btn-primario" id="imprimir" disabled>Imprimir</button>
  </div>
  <p class="error" id="error" role="alert" hidden></p>

  <div class="vista"><div class="hoja" id="hoja"></div></div>
</main>

<script>
  const { NOMBRE_TIENDA, NEGOCIO = {} } = window.APP_CONFIG;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Dirección del catálogo junto a esta página: sirve igual en GitHub Pages que en pruebas
  const URL_CATALOGO = new URL('catalogo.html', location.href).href;
  const URL_CORTA = URL_CATALOGO.replace(/^https?:\/\//, '');

  document.title = `Tarjeta del catálogo | ${NOMBRE_TIENDA}`;
  $('#nombreTienda').textContent = NOMBRE_TIENDA;

  // QR como SVG: nítido a cualquier tamaño de impresión. Corrección M (aguanta algo de suciedad o arrugas)
  function qrSvg(texto) {
    const q = qrcode(0, 'M');
    q.addData(texto);
    q.make();
    const n = q.getModuleCount(), m = 2;   // m: margen blanco en módulos
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
    return `<svg class="qr" viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges" role="img" aria-label="Código QR del catálogo">`
      + `<rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  let qr = '';

  const pistola = '<div class="pistola"><img src="marca-rb.png" alt=""></div>';
  const lockup = `
    <div class="lockup">
      <div class="l-nombre">${esc(NOMBRE_TIENDA)}</div>
      <div class="l-linea"></div>
      <div class="l-sub">Herramientas y materiales</div>
    </div>`;
  const datos = () => [NEGOCIO.DIRECCION, NEGOCIO.TELEFONO && `Tel. ${NEGOCIO.TELEFONO}`].filter(Boolean).map(esc).join(' · ');

  const DISENOS = {
    frente: () => `<div class="tarjeta negra frente">${pistola}${lockup}</div>`,
    claro: (titulo, mensaje) => `
      <div class="tarjeta reverso claro">
        <div class="texto">
          <div class="ceja-fila"><div class="raya"></div><div class="ceja">${esc(NOMBRE_TIENDA)}</div></div>
          <div class="titulo">${titulo}</div>
          <div class="mensaje">${mensaje}</div>
          ${datos() ? `<div class="datos">${datos()}</div>` : ''}
        </div>
        <div class="qr-col"><div class="qr-caja">${qr}</div><div class="pie-qr">Pintura automotriz</div></div>
      </div>`,
    oscuro: (titulo, mensaje) => `
      <div class="tarjeta negra reverso oscuro">
        <div class="texto">
          <div class="ceja-fila">${pistola}<div class="ceja">${esc(NOMBRE_TIENDA)}</div></div>
          <div class="titulo">${titulo}</div>
          <div class="raya"></div>
          <div class="mensaje">${mensaje}</div>
          ${datos() ? `<div class="datos">${datos()}</div>` : ''}
        </div>
        <div class="qr-caja">${qr}</div>
      </div>`
  };

  function pintar() {
    const formato = $('#formato').value;
    const titulo = esc($('#titulo').value.trim()), mensaje = esc($('#mensaje').value.trim());
    document.querySelectorAll('[data-texto]').forEach((c) => { c.hidden = formato === 'frente'; });
    $('#hoja').classList.toggle('sin-margen', formato === 'aviso');
    if (formato === 'aviso') {
      $('#hoja').innerHTML = `
        <div class="aviso">
          <div class="banda">${pistola}${lockup}</div>
          <div class="cuerpo">
            <div class="ceja-fila"><div class="raya"></div><div class="ceja">Pintura automotriz y accesorios</div><div class="raya"></div></div>
            <div class="titulo">${titulo}</div>
            <div class="qr-caja">${qr}</div>
            <div class="mensaje">${mensaje}</div>
            <div class="datos">${[esc(URL_CORTA), datos()].filter(Boolean).join(' · ')}</div>
          </div>
        </div>`;
    } else {
      // Las 10 iguales y la grilla centrada: al imprimir el respaldo, frente y reverso coinciden
      $('#hoja').innerHTML = `<div class="tarjetas">${DISENOS[formato](titulo, mensaje).repeat(10)}</div>`;
    }
  }

  function iniciar() {
    if (!window.qrcode) {
      $('#error').textContent = 'No se pudo cargar el generador de códigos QR. Revisa el internet y recarga la página.';
      $('#error').hidden = false;
      return;
    }
    qr = qrSvg(URL_CATALOGO);
    pintar();
    $('#imprimir').disabled = false;
  }

  ['#formato', '#titulo', '#mensaje'].forEach((s) => $(s).addEventListener('input', pintar));
  $('#imprimir').addEventListener('click', async () => {
    await document.fonts.ready;   // que salga con Bebas Neue y Barlow, no con la letra del sistema
    window.print();
  });
  iniciar();
</script>
</body>
</html>
