<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contraseña</title>
<link rel="icon" href="favicon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root {
    color-scheme: light dark;   /* barras de desplazamiento y controles según el tema */
    --fondo: #E3E4E1; --panel: #F6F6F3; --tinta: #1A2127; --suave: #5B646B;
    --linea: #C6CAC8; --acento: #0E5266; --acento-tinta: #FFFFFF;
    --alerta: #A1281F; --ok: #2F6B3A; --radio: 6px;
    font-family: "Barlow", system-ui, sans-serif; color: var(--tinta); background: var(--fondo);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #171C20; --panel: #20272D; --tinta: #E8EBEB; --suave: #9AA3A9;
      --linea: #343E46; --acento: #5AAEC4; --acento-tinta: #0B2530;
      --alerta: #E57B72; --ok: #7FC08A;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-size: 16px; line-height: 1.45; }
  [hidden] { display: none !important; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
  input { font: inherit; color: var(--tinta); background: var(--panel); border: 1px solid var(--linea); border-radius: var(--radio); padding: .5rem .65rem; width: 100%; min-height: 2.75rem; }
  label { font-weight: 600; }
  .campo { display: grid; gap: .3rem; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 2.75rem;
    border: 1px solid var(--linea); background: var(--panel); color: var(--tinta); padding: .45rem .9rem;
    border-radius: 8px; white-space: nowrap; text-decoration: none; font-weight: 600;
  }
  .btn-primario { background: var(--acento); color: var(--acento-tinta); border-color: var(--acento); font-weight: 700; }
  .btn-primario:disabled { opacity: .45; cursor: not-allowed; }
  h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 700; margin: 0; font-size: 1.8rem; }

  .barra { display: flex; align-items: center; gap: 1rem; padding: .7rem 1.25rem; background: var(--panel); border-bottom: 1px solid var(--linea); }
  .marca { display: flex; align-items: center; gap: .55rem; color: inherit; text-decoration: none; min-width: 0; }
  .tienda { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 1.45rem; }
  .logo { height: 3.3rem; width: auto; display: block; flex: none; margin: -.45rem 0; }

  form { max-width: 22rem; margin: 12vh auto 0; padding: 1.5rem; background: var(--panel); border: 1px solid var(--linea); border-radius: var(--radio); display: grid; gap: 1rem; }
  .ayuda { color: var(--suave); margin: 0; }
  .mensaje { margin: 0; min-height: 1.4em; }
  .mensaje.error { color: var(--alerta); font-weight: 600; }
  .mensaje.ok { color: var(--ok); font-weight: 600; }
  .volver { justify-self: center; color: var(--acento); font-weight: 600; text-decoration: none; padding: .5rem; }

  @media (max-width: 700px) {
    .barra { padding: .6rem 1rem; }
    .tienda { font-size: 1.25rem; }
    .logo { height: 2.9rem; margin: -.3rem 0; }
    form { margin: 6vh 1rem 0; }
  }
</style>
</head>
<body>

<header class="barra">
  <a class="marca" href="index.html" aria-label="Ir a la caja"><img class="logo" src="logo.svg" alt="" width="24" height="40"><span class="tienda" id="nombreTienda">Pinturas</span></a>
</header>

<p class="ayuda" id="cargando" style="text-align:center;margin-top:12vh">Un momento…</p>

<!-- Sin sesión: pedir el enlace por correo -->
<form id="frmPedir" hidden>
  <h1>Recuperar contraseña</h1>
  <p class="ayuda">Escribe tu correo y te enviamos un enlace para crear una contraseña nueva.</p>
  <div class="campo"><label for="pedirEmail">Correo</label><input id="pedirEmail" type="email" autocomplete="username" required></div>
  <p class="mensaje" id="pedirMsg" role="status"></p>
  <button class="btn btn-primario" type="submit" id="pedirBtn">Enviar enlace</button>
  <a class="volver" href="index.html">Volver a iniciar sesión</a>
</form>

<!-- Desde el enlace del correo (invitación o recuperación) o con sesión: poner la contraseña -->
<form id="frmClave" hidden>
  <h1 id="claveTitulo">Nueva contraseña</h1>
  <p class="ayuda" id="claveAyuda"></p>
  <input type="email" id="claveEmail" autocomplete="username" hidden>
  <div class="campo"><label for="clave1">Contraseña nueva</label><input id="clave1" type="password" autocomplete="new-password" minlength="8" required></div>
  <div class="campo"><label for="clave2">Repítela</label><input id="clave2" type="password" autocomplete="new-password" minlength="8" required></div>
  <p class="mensaje" id="claveMsg" role="alert"></p>
  <button class="btn btn-primario" type="submit" id="claveBtn">Guardar contraseña</button>
  <a class="volver" href="index.html" id="claveVolver">Cancelar</a>
</form>

<script>
  const { SUPABASE_URL, SUPABASE_ANON_KEY, NOMBRE_TIENDA } = window.APP_CONFIG;
  // El enlace del correo trae en el # el tipo (invite / recovery) o un error.
  // Se lee antes de crear el cliente, que lo procesa y lo borra de la dirección.
  const hash = new URLSearchParams(location.hash.slice(1));
  const tipo = hash.get('type');
  const errorEnlace = hash.get('error_description') || hash.get('error');

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (s) => document.querySelector(s);
  document.title = `Contraseña | ${NOMBRE_TIENDA}`;
  $('#nombreTienda').textContent = NOMBRE_TIENDA;

  const mensaje = (el, texto, clase = '') => { el.textContent = texto; el.className = `mensaje ${clase}`; };

  // Mensajes de Supabase Auth en español
  function traducir(e) {
    const m = e?.message || String(e);
    if (/different from the old/i.test(m)) return 'La contraseña nueva debe ser distinta de la anterior.';
    if (/at least|too short|weak/i.test(m)) return 'La contraseña es muy débil. Usa al menos 8 caracteres, con letras y números.';
    if (/seconds|rate limit|too many/i.test(m)) return 'Ya se envió un correo hace poco. Espera un minuto e intenta de nuevo.';
    if (/session|jwt|expired|missing/i.test(m)) return 'El enlace venció o ya se usó. Pide uno nuevo.';
    if (/fetch|network/i.test(m)) return 'Sin conexión. Revisa el internet e intenta de nuevo.';
    return m;
  }

  function mostrar(cual) {
    $('#cargando').hidden = true;
    $('#frmPedir').hidden = cual !== 'pedir';
    $('#frmClave').hidden = cual !== 'clave';
    (cual === 'pedir' ? $('#pedirEmail') : $('#clave1')).focus();
  }

  async function iniciar() {
    const { data } = await db.auth.getSession();   // espera a que se procese el enlace
    const session = data?.session;

    if (errorEnlace && !session) {
      mostrar('pedir');
      return mensaje($('#pedirMsg'), 'El enlace venció o ya se usó. Escribe tu correo y te enviamos uno nuevo.', 'error');
    }
    if (!session) return mostrar('pedir');

    $('#claveEmail').value = session.user.email ?? '';   // para que el navegador guarde la contraseña con el correo
    if (tipo === 'invite') {
      $('#claveTitulo').textContent = 'Crea tu contraseña';
      $('#claveAyuda').textContent = `Te damos la bienvenida a ${NOMBRE_TIENDA}. Crea la contraseña con la que vas a entrar (${session.user.email}).`;
      $('#claveVolver').hidden = true;
    } else if (tipo === 'recovery') {
      $('#claveAyuda').textContent = `Escribe la contraseña nueva para ${session.user.email}.`;
      $('#claveVolver').hidden = true;
    } else {
      $('#claveTitulo').textContent = 'Cambiar contraseña';
      $('#claveAyuda').textContent = `Sesión iniciada como ${session.user.email}.`;
    }
    mostrar('clave');
  }

  $('#frmPedir').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#pedirBtn');
    btn.disabled = true;
    mensaje($('#pedirMsg'), 'Enviando…');
    const { error } = await db.auth.resetPasswordForEmail($('#pedirEmail').value.trim(), {
      // Abierta desde un archivo del disco, el enlace va a la app publicada
      redirectTo: new URL('clave.html', location.protocol.startsWith('http') ? location.href
        : window.APP_CONFIG.URL_APP || 'https://guiral97.github.io/PinturasRebas/').href
    });
    btn.disabled = false;
    // No se dice si el correo existe o no: así nadie puede averiguar quién tiene cuenta
    if (error) mensaje($('#pedirMsg'), traducir(error), 'error');
    else mensaje($('#pedirMsg'), 'Si ese correo tiene cuenta, en unos minutos te llega el enlace. Revisa también la carpeta de spam.', 'ok');
  });

  $('#frmClave').addEventListener('submit', async (e) => {
    e.preventDefault();
    const c1 = $('#clave1').value, c2 = $('#clave2').value;
    if (c1.length < 8) return mensaje($('#claveMsg'), 'Usa al menos 8 caracteres.', 'error');
    if (c1 !== c2) return mensaje($('#claveMsg'), 'Las dos contraseñas no coinciden.', 'error');
    const btn = $('#claveBtn');
    btn.disabled = true;
    const { error } = await db.auth.updateUser({ password: c1 });
    btn.disabled = false;
    if (error) return mensaje($('#claveMsg'), traducir(error), 'error');
    mensaje($('#claveMsg'), 'Contraseña guardada. Entrando…', 'ok');
    setTimeout(() => location.replace('index.html'), 1200);
  });

  iniciar();
</script>
</body>
</html>
